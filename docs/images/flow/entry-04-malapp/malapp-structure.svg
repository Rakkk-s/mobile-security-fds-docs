<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="860" height="340" fill="white"/>
<text x="30" y="40" font-size="20" font-weight="bold" fill="#2C2C2A">금융권 악성 앱의 이중 구조 — 하나가 여럿을 부른다</text>

<!-- 피해자 -->
<text x="90" y="120" font-size="13" fill="#5F5E5A" text-anchor="middle">피해자</text>
<circle cx="90" cy="165" r="34" fill="white" stroke="#B39DDB" stroke-width="1.5"/>
<rect x="76" y="148" width="28" height="40" rx="4" fill="none" stroke="#7E57C2" stroke-width="2"/><line x1="84" y1="182" x2="96" y2="182" stroke="#7E57C2" stroke-width="2"/>
<text x="90" y="225" font-size="11" fill="#888780" text-anchor="middle">문자·전화·광고로</text>
<text x="90" y="241" font-size="11" fill="#888780" text-anchor="middle">직접 설치</text>

<path d="M 128 165 L 178 165" stroke="#888780" stroke-width="2" fill="none" marker-end="url(#arr)"/>

<!-- 1차 앱 -->
<rect x="180" y="115" width="180" height="100" rx="10" fill="#9575CD" stroke="#7E57C2" stroke-width="1.5"/>
<text x="270" y="142" font-size="15" font-weight="bold" fill="white" text-anchor="middle">1차 앱</text>
<text x="270" y="164" font-size="11.5" fill="#EDE7F6" text-anchor="middle">금융회사 위장</text>
<text x="270" y="184" font-size="11.5" fill="#EDE7F6" text-anchor="middle">대출 정보 탈취</text>
<text x="270" y="204" font-size="11.5" fill="white" text-anchor="middle" font-weight="bold">+ 2차 앱 설치 통로</text>

<path d="M 362 165 L 412 165" stroke="#888780" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="387" y="152" font-size="10.5" fill="#A32D2D" text-anchor="middle">몰래</text>
<text x="387" y="182" font-size="10.5" fill="#A32D2D" text-anchor="middle">설치</text>

<!-- 2차 앱 -->
<rect x="414" y="115" width="180" height="100" rx="10" fill="#5E35B1" stroke="#4527A0" stroke-width="1.5"/>
<text x="504" y="142" font-size="15" font-weight="bold" fill="white" text-anchor="middle">2차 앱</text>
<text x="504" y="164" font-size="11.5" fill="#D1C4E9" text-anchor="middle">보안·백신 앱 위장</text>
<text x="504" y="184" font-size="11.5" fill="#D1C4E9" text-anchor="middle">데이터 탈취·원격제어</text>
<text x="504" y="204" font-size="11.5" fill="#D1C4E9" text-anchor="middle">전화 가로채기</text>

<path d="M 596 165 L 646 165" stroke="#888780" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="621" y="152" font-size="10.5" fill="#888780" text-anchor="middle">기능</text>
<text x="621" y="182" font-size="10.5" fill="#888780" text-anchor="middle">분리</text>

<!-- 2차 분리 -->
<rect x="648" y="118" width="182" height="44" rx="8" fill="#311B92" stroke="#1A0E5C" stroke-width="1.2"/>
<text x="739" y="139" font-size="12.5" font-weight="bold" fill="white" text-anchor="middle">2차_main</text>
<text x="739" y="155" font-size="10" fill="#D1C4E9" text-anchor="middle">데이터 탈취·원격제어</text>

<rect x="648" y="168" width="182" height="44" rx="8" fill="#311B92" stroke="#1A0E5C" stroke-width="1.2"/>
<text x="739" y="189" font-size="12.5" font-weight="bold" fill="white" text-anchor="middle">2차_call</text>
<text x="739" y="205" font-size="10" fill="#D1C4E9" text-anchor="middle">보이스피싱·통화 가로채기</text>

<!-- 타임라인 캡션 -->
<rect x="30" y="262" width="800" height="52" rx="8" fill="white" stroke="#D1C4E9" stroke-width="1.2"/>
<text x="50" y="286" font-size="15" fill="#4527A0" font-weight="bold">진화 방향 : 단일 앱 → 1차·2차 분리 → 2차를 main·call로 재분리</text>
<text x="50" y="307" font-size="13.5" fill="#5F5E5A">기능을 쪼갤수록 백신은 앱 하나만 봐서는 전체 악성 행위를 판단하기 어려워진다 — 탐지 회피가 목적</text>

<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/></marker>
</defs>
</svg>